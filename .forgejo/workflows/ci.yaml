name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: codeberg-small-lazy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: '18'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test